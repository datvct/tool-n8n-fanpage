services:
  postgres:
    image: postgres:16-alpine
    container_name: content-manager-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-content_manager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-content_manager}
      POSTGRES_DB: ${POSTGRES_DB:-content_manager}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - content_manager_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-content_manager} -d ${POSTGRES_DB:-content_manager}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  content_manager_pgdata:
