services:
  postgres:
    image: postgres:16-alpine
    container_name: content-manager-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: content_manager
      POSTGRES_PASSWORD: content_manager
      POSTGRES_DB: content_manager
    ports:
      - "5433:5432"
    volumes:
      - content_manager_pgdata:/var/lib/postgresql/data

volumes:
  content_manager_pgdata:
