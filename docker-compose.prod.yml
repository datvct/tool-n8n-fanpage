services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-content_manager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-content_manager}
    volumes:
      - content_manager_pgdata:/var/lib/postgresql/data
    # Keep PostgreSQL private; access it from TablePlus through an SSH tunnel.
    ports:
      - "0.0.0.0:${POSTGRES_HOST_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-content_manager} -d ${POSTGRES_DB:-content_manager}"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 30
    networks:
      - content_manager_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-content_manager}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-content_manager}
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    networks:
      - content_manager_network
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  content_manager_pgdata:

networks:
  content_manager_network:
    driver: bridge